# DigitalOcean App Platform spec (verify field names against current DO docs before deploying).
# Deploy: doctl apps create --spec .do/app.yaml
#  - static_site "web": built once, served from DO's global CDN
#  - service "api": 2+ instances behind App Platform's managed load balancer (horizontal scaling)
#  - worker "ingest": consumes the Redis Streams job queue
#  - databases: Managed PostgreSQL (add a read-only replica in the DB console, then set DATABASE_READ_URL)
#               and Managed Valkey/Redis-compatible store for cache, queue and pub/sub
#
# LIMITATION (read before using this spec): App Platform services and workers do NOT share a filesystem.
# Book uploads are stored by the API and processed by the worker from the same STORAGE_DIR, so uploads
# need shared object storage (DigitalOcean Spaces / S3). That storage backend is NOT implemented yet
# (see docs/LIMITATIONS.md). Until then, deploy the full library on a Droplet with `docker compose`
# (docs/DEPLOY_DIGITALOCEAN.md); this spec is suitable for search and harvested open resources only.
name: granthsetu
region: blr
services:
  - name: api
    github: { repo: YOUR_GITHUB_USER/granthsetu, branch: main, deploy_on_push: true }
    dockerfile_path: backend/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    routes: [{ path: /api, preserve_path_prefix: true }]
    health_check: { http_path: /api/health }
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: DATABASE_READ_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }  # replace with the replica URL
      - { key: REDIS_URL, scope: RUN_TIME, value: "${cache.DATABASE_URL}" }
      - { key: GEMINI_API_KEY, scope: RUN_TIME, type: SECRET }
      - { key: AUTOMATION_TOKEN, scope: RUN_TIME, type: SECRET }
      - { key: COOKIE_SECURE, scope: RUN_TIME, value: "true" }
      - { key: EMBEDDING_PROVIDER, scope: RUN_TIME, value: auto }
workers:
  - name: ingest
    github: { repo: YOUR_GITHUB_USER/granthsetu, branch: main, deploy_on_push: true }
    dockerfile_path: backend/Dockerfile
    source_dir: /
    run_command: python -m granthsetu.ingest
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: REDIS_URL, scope: RUN_TIME, value: "${cache.DATABASE_URL}" }
      - { key: GEMINI_API_KEY, scope: RUN_TIME, type: SECRET }
      - { key: REFRESH_INTERVAL_S, scope: RUN_TIME, value: "21600" }
static_sites:
  - name: web
    github: { repo: YOUR_GITHUB_USER/granthsetu, branch: main, deploy_on_push: true }
    source_dir: frontend
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    routes: [{ path: / }]
databases:
  - { name: db, engine: PG, version: "16", production: false }
  - { name: cache, engine: VALKEY, production: false }
