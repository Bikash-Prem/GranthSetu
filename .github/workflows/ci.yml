name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: gs, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: gs_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gs" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r backend/requirements-dev.txt
      - name: unit + integration tests (SQLite)
        run: cd backend && pytest -q
      - name: same tests on PostgreSQL
        run: cd backend && PG_TEST_URL=postgresql://gs:ci-only-password@localhost:5432/gs_test pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npx tsc --noEmit -p . && npm run build
