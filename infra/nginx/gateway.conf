# API gateway + load balancer + static CDN origin for GranthSetu.
# - Routes /api/* to the pool of stateless API replicas (least connections).
# - Re-resolves the `api` service name so `docker compose up --scale api=N` is picked up live.
# - Edge rate limiting per client IP (the API also enforces per-route limits in Redis).
# - Long-lived immutable caching for hashed assets so a CDN can serve them.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_pool {
    zone api_pool 64k;
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=upload_rl:10m rate=1r/s;
limit_req_status 429;
proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=micro:10m max_size=50m inactive=1m use_temp_path=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Server-Sent Events: no buffering, long timeout
    location = /api/events {
        proxy_pass http://api_pool;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location = /api/scan {
        limit_req zone=upload_rl burst=5 nodelay;
        proxy_pass http://api_pool;
        proxy_read_timeout 120s;
    }

    # Micro-cache cheap, public, read-only lists for 3 s (absorbs refresh storms)
    location ~ ^/api/(resources|gaps|eval/latest)$ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_cache micro;
        # Responses can depend on who is signed in: never serve or store them from the shared cache.
        proxy_cache_bypass $cookie_gs_session $http_authorization;
        proxy_no_cache $cookie_gs_session $http_authorization;
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://api_pool;
    }

    # Book uploads (management only; the API checks permissions, type, size and checksum)
    location ^~ /api/manage/ {
        client_max_body_size 55m;
        limit_req zone=api_rl burst=40 nodelay;
        proxy_request_buffering on;
        proxy_pass http://api_pool;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://api_pool;
        proxy_read_timeout 120s;
    }

    # Static app (CDN origin)
    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
